summary: >-
  The Federal Labor Relations Authority publishes no plans, no tiers and no prices, and there
  is nothing here that could carry one. The FLRA is an independent US federal agency that
  administers the federal-sector labor-management relations program under 5 U.S.C. Chapter 71;
  its services (case filing, representation elections, negotiability determinations, arbitration
  review, training) are statutory functions funded by congressional appropriation, not products
  sold to customers. It operates no API, no developer program and no billable surface, so
  plan_count is an honest zero rather than a gap in our research.
