x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    The FLRA runs a Drupal website with an eFiling flow and an eLibrary case-document search for
    end users, but no developer program of any kind — /api, /api-docs, /developers, /developer,
    /jsonapi, /graphql, /openapi.json, /swagger.json and every named /.well-known/ path all return
    the Drupal 404 page, api.flra.gov / data.flra.gov / developer.flra.gov do not resolve in DNS,
    and the agency's own Open Government page says its data is still "in the process" of being
    submitted to data.gov, so the only machine-readable output it publishes is seven RSS feeds.
